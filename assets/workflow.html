<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>masterTHPT — workflow</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;padding:28px;background:#eceef2;color:#1f2937;
    font:14px/1.4 ui-sans-serif,-apple-system,"Segoe UI",Inter,"Noto Sans",sans-serif;
  }
  .fig{background:#fff;border-radius:6px;border:1px solid #dcdfe5;padding:16px 12px;margin:0 auto;max-width:1240px}
  .fig svg{display:block;width:100%;height:auto}

  .p text{font-family:"Latin Modern Roman",Cambria,Georgia,"Times New Roman",serif;fill:#1a1a1a}
  .p .ttl{font-size:15px;font-style:italic;font-weight:700}
  .p .pnl{font-size:13px;font-style:italic;fill:#5b4a72}
  .p .box{font-size:12px}
  .p .sub{font-size:9px;fill:#6b7280}
  .p .lbl{font-size:10.5px}
  .p .key{font-size:11px}
  .p .cap{font-size:12px;font-style:italic;fill:#4b5563}
  .p .out{fill:#8b1a1a;font-size:10.5px}
  .p .bg{fill:#1f2937;stroke:#fff;stroke-width:1.5}
  .p .bn{fill:#fff;font-size:10.5px;font-weight:700}
  .p path,.p line,.p rect,.p ellipse,.p polygon{vector-effect:non-scaling-stroke}
  .p .w{fill:none;stroke:#2b2b2b;stroke-width:1.1;marker-end:url(#mk)}
  .p .bus{fill:none;stroke:#2b2b2b;stroke-width:1.1}
  .p .r{fill:none;stroke:#8b1a1a;stroke-width:1.2;marker-end:url(#mkr)}
  .p .d{stroke-dasharray:5 3.5}
</style>
</head>
<body>

<figure class="fig">
<svg class="p" viewBox="0 0 1200 988" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="mk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1.4 L7.4 4.5 L1 7.6 z" fill="#2b2b2b"/></marker>
    <marker id="mkr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1.4 L7.4 4.5 L1 7.6 z" fill="#8b1a1a"/></marker>
  </defs>

  <!-- reading key -->
  <text class="key" x="600" y="16" text-anchor="middle">Everything flows left to right; the two dark red wires at the bottom are the only returns.</text>
  <text class="key" x="600" y="34" text-anchor="middle">❶ Student submits → ❷ Stored as attempts → ❸ Teacher scores → ❹ Verifier re-checks, Learner updates mastery → ❺ Weakest concept restocks → ❻ Crawler → ❼ Parser (or Author) → ❽ Dedupe + Tagger → Back to ❶</text>
  <line x1="30" y1="46" x2="1170" y2="46" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- ============ ENTRY ============ -->
  <rect x="30" y="140" width="84" height="560" rx="10" fill="#eef1f7" stroke="#1f2937" stroke-width="1.9"/>
  <text class="lbl" x="72" y="196" text-anchor="middle">start here</text>
  <text class="box" x="72" y="404" text-anchor="middle">Next.js</text>
  <text class="box" x="72" y="421" text-anchor="middle">UI</text>
  <text class="sub" x="72" y="438" text-anchor="middle">student</text>

  <path class="w" d="M114,190 H192"/>
  <text class="lbl" x="153" y="182" text-anchor="middle">new attempt</text>

  <!-- ============ GRADING PHASE ============ -->
  <text class="ttl" x="368" y="72">Grading Phase</text>

  <path d="M192,170 V230 a48,11 0 0 0 96,0 V170" fill="#f4f5f7" stroke="#4b5563" stroke-width="1.1"/>
  <ellipse cx="240" cy="170" rx="48" ry="11" fill="#fbfbfc" stroke="#4b5563" stroke-width="1.1"/>
  <text class="box" x="240" y="206" text-anchor="middle">history.db</text>
  <text class="sub" x="240" y="220" text-anchor="middle">attempts</text>

  <path class="w" d="M240,241 V310"/>
  <text class="lbl" x="232" y="288" text-anchor="end">ungraded</text>

  <polygon points="195,356 225,310 335,310 305,356" fill="#e3f0e6" stroke="#5f8a6b" stroke-width="1.1"/>
  <text class="box" x="265" y="338" text-anchor="middle">submissions</text>
  <path class="w" d="M280,310 C284,288 318,288 320,310"/>
  <text class="lbl" x="310" y="280" text-anchor="middle">matches reference</text>

  <path class="w" d="M320,333 H390"/>
  <path class="bus" d="M390,146 V420"/>

  <rect x="368" y="80" width="620" height="392" rx="14" fill="#f8f4fc" stroke="#c3aedb" stroke-width="1.1"/>
  <text class="pnl" x="386" y="100">On every submitted attempt</text>

  <!-- lane A: score -->
  <path class="w" d="M390,146 H472"/>
  <text class="lbl" x="431" y="138" text-anchor="middle">(a¹, a², ⋯, aⁿ)</text>
  <path class="w" d="M390,172 H472"/>
  <text class="lbl" x="431" y="186" text-anchor="middle">s</text>
  <rect x="472" y="132" width="140" height="54" rx="8" fill="#fdf6d5" stroke="#c9b043" stroke-width="1.1"/>
  <text class="box" x="542" y="155" text-anchor="middle">Teacher</text>
  <text class="sub" x="542" y="170" text-anchor="middle">rubric first, then LLM</text>
  <path class="w" d="M612,159 H714"/>
  <text class="lbl" x="663" y="151" text-anchor="middle">answer key exists</text>
  <path class="w" d="M542,186 V282"/>
  <text class="lbl" x="534" y="212" text-anchor="end">(e¹, ⋯, eⁿ)</text>
  <text class="lbl" x="534" y="228" text-anchor="end">flagged for re-check</text>
  <path class="w" d="M612,296 H680 V202 H714"/>
  <polygon points="714,104 826,150 826,214 714,260" fill="#fadcdc" stroke="#c08484" stroke-width="1.1"/>
  <text class="box" x="770" y="178" text-anchor="middle">Compute</text>
  <text class="box" x="770" y="194" text-anchor="middle">Score</text>

  <!-- lane B: mastery -->
  <path class="w" d="M390,296 H472"/>
  <text class="lbl" x="431" y="288" text-anchor="middle">(a¹, a², ⋯, aⁿ)</text>
  <path class="w" d="M390,322 H472"/>
  <text class="lbl" x="431" y="336" text-anchor="middle">s</text>
  <rect x="472" y="282" width="140" height="54" rx="8" fill="#fdf6d5" stroke="#c9b043" stroke-width="1.1"/>
  <text class="box" x="542" y="305" text-anchor="middle">Verifier</text>
  <text class="sub" x="542" y="320" text-anchor="middle">SymPy · flagged only</text>
  <path class="w" d="M612,322 H702"/>
  <text class="lbl" x="657" y="314" text-anchor="middle">(v¹, ⋯, vⁿ)</text>
  <polygon points="702,272 788,300 788,344 702,372" fill="#fadcdc" stroke="#c08484" stroke-width="1.1"/>
  <text class="box" x="745" y="318" text-anchor="middle">Learner</text>
  <text class="sub" x="745" y="332" text-anchor="middle">mastery update</text>
  <path class="w" d="M788,322 H862"/>
  <text class="lbl" x="825" y="314" text-anchor="middle">(m¹, ⋯, mⁿ)</text>
  <polygon points="862,228 966,280 966,364 862,416" fill="#fadcdc" stroke="#c08484" stroke-width="1.1"/>
  <text class="box" x="914" y="318" text-anchor="middle">Pick Weakest</text>
  <text class="box" x="914" y="334" text-anchor="middle">Concept</text>
  <path class="w" d="M390,392 H745 V358"/>
  <text class="lbl" x="556" y="384" text-anchor="middle">prior mastery &#160;· learner.db</text>
  <path class="w d" d="M390,420 H765 V352"/>
  <text class="lbl" x="580" y="412" text-anchor="middle">knowledge graph &#160;· Neo4j prerequisites</text>

  <!-- restock: grading -> ingest -->
  <path class="r" d="M966,322 H1054 V512 H206 V562"/>
  <text class="out" x="580" y="504" text-anchor="middle">restock the weakest concept</text>

  <!-- ============ INGEST PHASE ============ -->
  <text class="ttl" x="368" y="540">Ingest Phase</text>

  <rect x="140" y="562" width="132" height="48" rx="8" fill="#fdf6d5" stroke="#c9b043" stroke-width="1.1"/>
  <text class="box" x="206" y="585" text-anchor="middle">Crawler</text>
  <text class="sub" x="206" y="599" text-anchor="middle">Tavily · skips known URLs</text>

  <path class="w" d="M206,610 V631"/>
  <path d="M158,642 V698 a48,11 0 0 0 96,0 V642" fill="#f4f5f7" stroke="#4b5563" stroke-width="1.1"/>
  <ellipse cx="206" cy="642" rx="48" ry="11" fill="#fbfbfc" stroke="#4b5563" stroke-width="1.1"/>
  <text class="box" x="206" y="676" text-anchor="middle">history.db</text>
  <text class="lbl" x="264" y="668">pending queue</text>
  <text class="lbl" x="264" y="682">waits for approval</text>

  <path class="w" d="M206,709 V752"/>
  <text class="lbl" x="216" y="734">approved for parsing</text>
  <polygon points="150,786 176,752 272,752 246,786" fill="#e3f0e6" stroke="#5f8a6b" stroke-width="1.1"/>
  <text class="box" x="211" y="774" text-anchor="middle">crawled docs</text>

  <path class="w" d="M259,769 H390"/>
  <path class="bus" d="M390,636 V769"/>
  <path class="w d" d="M272,586 H390 V636"/>
  <text class="lbl" x="320" y="578" text-anchor="middle">auto, no review</text>

  <rect x="368" y="548" width="620" height="250" rx="14" fill="#f8f4fc" stroke="#c3aedb" stroke-width="1.1"/>
  <text class="pnl" x="386" y="572">When practice stock runs low</text>

  <path class="w" d="M390,636 H472"/>
  <text class="lbl" x="431" y="628" text-anchor="middle">(d¹, ⋯, dⁿ)</text>
  <rect x="472" y="610" width="140" height="54" rx="8" fill="#fdf6d5" stroke="#c9b043" stroke-width="1.1"/>
  <text class="box" x="542" y="633" text-anchor="middle">Parser</text>
  <text class="sub" x="542" y="648" text-anchor="middle">Datalab OCR</text>

  <path class="w" d="M390,732 H472"/>
  <text class="lbl" x="431" y="724" text-anchor="middle">no doc found</text>
  <rect x="472" y="706" width="140" height="54" rx="8" fill="#fdf6d5" stroke="#c9b043" stroke-width="1.1"/>
  <text class="box" x="542" y="729" text-anchor="middle">Author</text>
  <text class="sub" x="542" y="744" text-anchor="middle">OpenRouter · writes items</text>

  <path class="w" d="M612,637 H726"/>
  <text class="lbl" x="669" y="629" text-anchor="middle">parsed items</text>
  <path class="w" d="M612,733 H726"/>
  <text class="lbl" x="669" y="725" text-anchor="middle">written items</text>

  <polygon points="726,598 820,640 820,718 726,760" fill="#fadcdc" stroke="#c08484" stroke-width="1.1"/>
  <text class="box" x="773" y="674" text-anchor="middle">Dedupe</text>
  <text class="sub" x="773" y="689" text-anchor="middle">new items only</text>

  <path class="w" d="M820,679 H882"/>
  <text class="lbl" x="851" y="671" text-anchor="middle">new items</text>
  <rect x="882" y="653" width="96" height="52" rx="8" fill="#fdf6d5" stroke="#c9b043" stroke-width="1.1"/>
  <text class="box" x="930" y="675" text-anchor="middle">Tagger</text>
  <text class="sub" x="930" y="690" text-anchor="middle">concept per item</text>

  <path class="w" d="M978,679 H1010"/>
  <path d="M1010,656 V702 a44,10 0 0 0 88,0 V656" fill="#f4f5f7" stroke="#4b5563" stroke-width="1.1"/>
  <ellipse cx="1054" cy="656" rx="44" ry="10" fill="#fbfbfc" stroke="#4b5563" stroke-width="1.1"/>
  <text class="box" x="1054" y="682" text-anchor="middle">item bank</text>
  <text class="sub" x="1054" y="695" text-anchor="middle">practice pool</text>

  <!-- ============ RETURNS ============ -->
  <path class="r" d="M826,182 H1150 V872 H58 V700"/>
  <text class="out" x="900" y="174" text-anchor="middle">score + feedback</text>
  <text class="out" x="700" y="866" text-anchor="middle">graded result → student</text>
  <path class="r" d="M1098,679 H1120 V846 H86 V700"/>
  <text class="out" x="700" y="840" text-anchor="middle">next practice set → student</text>

  <!-- reading order badges -->
  <g><circle class="bg" cx="22" cy="124" r="9.5"/><text class="bn" x="22" y="127.6" text-anchor="middle">1</text></g>
  <g><circle class="bg" cx="184" cy="143" r="9.5"/><text class="bn" x="184" y="146.6" text-anchor="middle">2</text></g>
  <g><circle class="bg" cx="464" cy="116" r="9.5"/><text class="bn" x="464" y="119.6" text-anchor="middle">3</text></g>
  <g><circle class="bg" cx="464" cy="266" r="9.5"/><text class="bn" x="464" y="269.6" text-anchor="middle">4</text></g>
  <g><circle class="bg" cx="848" cy="212" r="9.5"/><text class="bn" x="848" y="215.6" text-anchor="middle">5</text></g>
  <g><circle class="bg" cx="134" cy="546" r="9.5"/><text class="bn" x="134" y="549.6" text-anchor="middle">6</text></g>
  <g><circle class="bg" cx="464" cy="594" r="9.5"/><text class="bn" x="464" y="597.6" text-anchor="middle">7</text></g>
  <g><circle class="bg" cx="712" cy="582" r="9.5"/><text class="bn" x="712" y="585.6" text-anchor="middle">8</text></g>

  <!-- legend -->
  <path class="w d" d="M156,904 H202"/>
  <text class="lbl" x="210" y="908">depends on the knowledge graph</text>
  <polygon points="384,916 394,900 428,900 418,916" fill="#e3f0e6" stroke="#5f8a6b" stroke-width="1.1"/>
  <text class="lbl" x="436" y="912">data produced under artifacts/</text>

  <!-- symbols -->
  <text class="cap" x="600" y="962" text-anchor="middle"><tspan font-weight="700">Symbols.</tspan> <tspan font-style="italic">n</tspan> — questions in one attempt&#160;&#160;·&#160;&#160;<tspan font-style="italic">s</tspan> — item: question with its reference answer&#160;&#160;·&#160;&#160;<tspan font-style="italic">a</tspan> — student answer&#160;&#160;·&#160;&#160;<tspan font-style="italic">e</tspan> — evaluation: score with feedback</text>
  <text class="cap" x="600" y="981" text-anchor="middle"><tspan font-style="italic">v</tspan> — evaluation after re-checking&#160;&#160;·&#160;&#160;<tspan font-style="italic">m</tspan> — mastery of one concept&#160;&#160;·&#160;&#160;<tspan font-style="italic">d</tspan> — crawled document</text>
</svg>
</figure>

</body>
</html>
